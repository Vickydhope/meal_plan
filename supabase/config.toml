project_id = "meal_plan"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true

[functions.analyze-food]
verify_jwt = true

[functions.suggest-meals]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.cleanup-orphaned-food-images]
# Invoked only by the pg_cron job via a shared `x-cron-secret` header, never
# by an app user - there's no user JWT to verify.
verify_jwt = false
